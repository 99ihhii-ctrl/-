  { text: "وش الشي اللي كنت متأكد إنك تبيه في شريك حياة... وطلع مو مهم فعلاً؟", level: "values" },
  { text: "لو ما فيه أي قيود — وش الحياة اللي تتمناها لنا؟", level: "values" },
  { text: "وش الشيء اللي تحس إنك ضحيت فيه عشان علاقتنا؟", level: "values" },
  { text: "وش الشيء اللي تبيني أدعمك فيه أكثر؟", level: "values" },
  { text: "وش الحلم اللي تخاف تقوله لي عشان تحس إنه بعيد؟", level: "values" },
  { text: "وش الشي اللي تتمنى لو بدأنا فيه من أول يوم؟", level: "values" },
  { text: "وش الشي اللي تتمنى نتعلمه سوا مع الوقت؟", level: "values" },
  { text: "لو فيه هدف نبي نحققه ونسعى له من بكرة — وش بيكون؟", level: "values", note: "اتفقوا عليه وابدأوا فيه فعلاً من بكرة" },
  { text: "لو تكتب وعد واحد لعلاقتنا — وش يكون؟", level: "values" },
];

const freeQuestions = [
  { text: "وش الحركة اللي لو سواها أحدكم تخلي الثاني يذوب فوراً؟", level: "deep" },
  { text: "لو تكتب جملة وحدة تلخص علاقتكم — أيش تكتب؟", level: "deep" },
  { text: "وصّف اللحظة اللي حسيت فيها إنك تحب الثاني أكثر شيء في حياتك", level: "deep" },
  { text: "وش الشيء اللي يجعلك تحس إن الثاني يحبك بدون ما يقول كلمة؟", level: "deep" },
  { text: "أيش أكثر شيء تخاف تقوله للثاني وما قلته لحد الآن؟", level: "deep" },
  { text: "لو تصف حب الثاني لك بلون — أيش اللون ولماذا؟", level: "deep" },
  { text: "وش الشيء في الثاني تحس إنه خُلق فقط عشانك؟", level: "deep" },
  { text: "أيش اللحظة اللي قررت فيها بقلبك — هذا هو؟", level: "deep" },
  { text: "وش الشيء اللي تحب الثاني يعرفه عنك ولا أحد يعرفه؟", level: "deep" },
  { text: "أشر على مكان تحبه على جسمك — الثاني يغمض عينيه ويبدأ يقبّلك لحد ما يلقى المكان", level: "hot" },
];

const FREE_LIMIT = 10;
const IS_LOCKED = true;

let activeList = [];
let current = 0;

function getLevelClass(level) {
  if (level === 'deep') return 'level-badge level-deep';
  if (level === 'hot') return 'level-badge level-hot';
  if (level === 'values') return 'level-badge level-values';
  return 'level-badge level-understand';
}
function getLevelText(level) {
  if (level === 'deep') return '💙 عميقة';
  if (level === 'hot') return '🔥 تحدي';
  if (level === 'values') return '🌱 قيم ومستقبل';
  return '💚 فهم بعض';
}

function startCategory(cat) {
  if (IS_LOCKED) {
    activeList = [...freeQuestions];
  } else if (cat === 'all') {
    activeList = [...allQuestions].sort(function() { return Math.random() - 0.5; });
  } else {
    activeList = allQuestions.filter(function(q) { return q.level === cat; }).sort(function() { return Math.random() - 0.5; });
  }
  current = 0;
  document.getElementById('picker').style.display = 'none';
  document.getElementById('gameSection').style.display = 'block';
  document.getElementById('endScreen').style.display = 'none';
  document.getElementById('lockedScreen').style.display = 'none';
  showQuestion();
}

function backToPicker() {
  document.getElementById('picker').style.display = 'block';
  document.getElementById('gameSection').style.display = 'none';
  document.getElementById('endScreen').style.display = 'none';
  document.getElementById('lockedScreen').style.display = 'none';
}

function renderProgress() {
  const p = document.getElementById('progress');
  p.innerHTML = '';
  const total = IS_LOCKED ? FREE_LIMIT : activeList.length;
  for (let i = 0; i < total; i++) {
    const dot = document.createElement('div');
    dot.className = 'dot' + (i === current ? ' active' : i < current ? ' done' : '');
    p.appendChild(dot);
  }
}

function showQuestion() {
  if (IS_LOCKED && current >= FREE_LIMIT) { showLocked(); return; }
  if (current >= activeList.length) { showEnd(); return; }
  const q = activeList[current];
  const badge = document.getElementById('qLevel');
  badge.className = getLevelClass(q.level);
  badge.textContent = getLevelText(q.level);
  const total = IS_LOCKED ? FREE_LIMIT : activeList.length;
  document.getElementById('qNumber').textContent = IS_LOCKED
    ? 'سؤال ' + (current + 1) + ' من ' + total + ' (تجربة مجانية)'
    : 'سؤال ' + (current + 1) + ' من ' + total;
  document.getElementById('qText').textContent = q.text;
  document.getElementById('qNote').textContent = q.note || '';
  document.getElementById('prevBtn').disabled = current === 0;
  renderProgress();
}

function nextQuestion() { current++; showQuestion(); }
function skipQuestion() { current++; showQuestion(); }
function prevQuestion() { if (current > 0) { current--; showQuestion(); } }

function showEnd() {
  document.getElementById('gameSection').style.display = 'none';
  document.getElementById('endScreen').style.display = 'flex';
}

function showLocked() {
  document.getElementById('gameSection').style.display = 'none';
  document.getElementById('lockedScreen').style.display = 'flex';
}

const container = document.getElementById('stars');
for (let i = 0; i < 120; i++) {
  const star = document.createElement('div');
  star.classList.add('star');
  const size = Math.random() * 2.5 + 0.5;
  star.style.cssText = 'width:' + size + 'px; height:' + size + 'px; top:' + (Math.random() * 100) + '%; left:' + (Math.random() * 100) + '%; animation-delay:' + (Math.random() * 3) + 's; animation-duration:' + (2 + Math.random() * 3) + 's;';
  container.appendChild(star);
}
</script>
</body>
</html>
