<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>بيننا — تواصل معنا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700&family=Noto+Sans+Arabic:wght@300;400;700&display=swap" rel="stylesheet"/>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Tajawal', 'Segoe UI', 'Noto Sans Arabic', Tahoma, Arial, sans-serif; background: #0d0d1a; color: #f0e6d3; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
.wrap { width: 100%; max-width: 480px; text-align: center; }
.logo { font-size: 14px; letter-spacing: 6px; color: #c9a96e; margin-bottom: 20px; }
h1 { font-size: 26px; margin-bottom: 10px; }
p.sub { font-size: 14px; color: #8a7a6a; margin-bottom: 30px; }
.box { background: rgba(255,255,255,0.04); border: 1px solid rgba(201,169,110,0.3); border-radius: 24px; padding: 36px 30px; }
input, textarea { width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: #f0e6d3; font-family: 'Tajawal', 'Segoe UI', 'Noto Sans Arabic', Tahoma, Arial, sans-serif; margin-bottom: 14px; font-size: 14px; }
textarea { min-height: 100px; resize: vertical; }
input::placeholder, textarea::placeholder { color: #5a4a3a; }
.btn { padding: 14px 32px; border-radius: 50px; font-size: 15px; font-weight: 700; font-family: 'Tajawal', 'Segoe UI', 'Noto Sans Arabic', Tahoma, Arial, sans-serif; border: none; cursor: pointer; background: linear-gradient(135deg, #c9a96e, #a07840); color: #0d0d1a; width: 100%; }
.btn:hover { opacity: 0.85; }
.back { display: block; text-align: center; margin-top: 24px; color: #5a4a3a; font-size: 13px; text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">بيننا</div>
  <h1>تواصل معنا</h1>
  <p class="sub">لأي استفسار أو اقتراح، يسعدنا نسمع منكم</p>
  <div class="box">
    <input type="text" id="nameInput" placeholder="الاسم"/>
    <input type="email" id="emailInput" placeholder="البريد الإلكتروني"/>
    <textarea id="messageInput" placeholder="رسالتكم"></textarea>
    <button class="btn" onclick="sendMessage()">إرسال</button>
  </div>
  <a href="index.html" class="back">العودة للرئيسية</a>
</div>

<script>
function sendMessage() {
  const name = document.getElementById('nameInput').value;
  const email = document.getElementById('emailInput').value;
  const message = document.getElementById('messageInput').value;

  if (!name || !email || !message) {
    alert('يرجى تعبئة جميع الحقول');
    return;
  }

  fetch('https://script.google.com/macros/s/AKfycbzGsubsZ1uL3ffrLKr0nh-Z_OjhMkayFTyFtr8O7WwInzSxDwIt9DXoTqG1bP-WGeIyRg/exec', {
    method: 'POST',
    body: JSON.stringify({ type: 'contact', name: name, email: email, message: message })
  });

  alert('تم إرسال رسالتكم بنجاح، شكراً لتواصلكم معنا 💌');
  document.getElementById('nameInput').value = '';
  document.getElementById('emailInput').value = '';
  document.getElementById('messageInput').value = '';
}
</script>
</body>
</html>
